# 升级说明，新的在最上面：每条一个 version 加各语言一段（zh、en……，可以再加别的语言）。
# Annulo 的升级卡片按界面语言从这里取（没有这种语言用 en）；git tag 的说明只写英文，文件里没有这一版时才用它。
# Upgrade notes, newest first: each entry has a version plus one note per language.

- version: 0.6.4
  zh: Instagram、Facebook 发帖卡在某一步时（找不到「下一步」、打不开发帖框），先请浏览器助手看页面帮这一步，碰到验证码会把浏览器弹出来请你处理；「分享 / 发布」仍由脚本点。需要 Annulo 新版本，老版本照原来报错。
  en: "When posting to Instagram or Facebook gets stuck (Next can't be found, the composer won't open), the browser assistant looks at the page and helps with that step, and brings the browser up for you on a CAPTCHA; Share / Post are still clicked by the script. Needs the latest Annulo; older versions report the error as before."
- version: 0.6.3
  zh: Instagram：有的账号发帖变成了整页（右上角「下一步」，没有弹窗），之前会报「选完图后没找到下一步」，现在两种发帖界面都能用。
  en: "Instagram: some accounts now get a full-page composer (\"Next\" at the top right, no dialog), which used to fail with \"Couldn't find Next after choosing images\"; both composers work now."
- version: 0.6.2
  zh: Instagram：修了文案填进说明框时重复两遍、或者前面多出上次留下的文字：每次填之前先清空说明框。
  en: "Instagram: fixed the caption being filled in twice or after leftover text from an earlier attempt — the caption box is cleared before filling."
- version: 0.6.1
  zh: Facebook、Instagram、LinkedIn、X：正文里已经写了的话题，发布时不再在末尾重复接一遍（之前会出现两行一样的话题）。
  en: "Facebook, Instagram, LinkedIn, X: hashtags already in the text aren't appended again when publishing (the hashtag line could show up twice)."
- version: 0.6.0
  zh: 添加 Facebook 时，个人号和你管理的公共主页列出来勾选，只添加勾上的（不同项目可以各用一个主页）；添加 YouTube 时，同一个 Google 账号下有几个频道也列出来勾选，发布、采集前自动切到对应的频道。Facebook 和 YouTube 的账号名、头像读对了（之前会读成「管理公共主页」「XX的头像」或频道 id）。需要模板的勾选弹窗：外贸第 122 版、自媒体 0.10.0 起。
  en: "When adding Facebook, your personal profile and the Pages you manage are listed to pick from, and only the picked ones are added (different projects can each use one Page); when adding YouTube, all channels under the Google account are listed the same way, and publishing and collecting switch to the right channel first. Facebook and YouTube account names and avatars are read correctly (they could show up as \"Manage Page\", \"X's profile picture\" or a channel id). Needs the picking dialog in the templates: Trade v122 and Creator 0.10.0 or later."
- version: 0.5.5
  zh: Facebook：发帖时弹出的推广窗（比如「直接与用户对话」让你加「立即拨打」按钮）会自动点「以后再说」关掉，定时发布不会被它挡住。
  en: "Facebook: promo popups that show up while posting (like \"Talk to people directly\" asking to add a Call button) are dismissed with \"Not now\", so scheduled posts aren't blocked by them."
- version: 0.5.4
  zh: Facebook：修了发帖卡在「下一页」、最后报「发布按钮一直是灰的」：Facebook 的发帖框改成了两层，现在能找到「下一页」和「发帖」按钮。
  en: "Facebook: fixed posting getting stuck on \"Next\" and failing with \"The Post button stayed disabled\" — Facebook's composer now has two layers, and the Next and Post buttons are found again."
- version: 0.5.3
  zh: Facebook：修了发帖时报「正文没填进发帖框」：正文改成整段粘贴进去，不再逐字打（打字会丢段落、带链接时顺序乱），重试也不会把正文填两遍。
  en: "Facebook: fixed \"Couldn't fill in the text\" when posting — the text is now pasted in whole instead of typed (typing dropped paragraphs and scrambled text around links), and a retry no longer fills it in twice."
- version: 0.5.2
  zh: 升级说明有了中英文：英文界面的升级卡片显示英文（需要 Annulo 下一个版本）。
  en: Upgrade notes now come in Chinese and English; the upgrade card follows your interface language (needs the next Annulo release).
- version: 0.5.1
  zh: 知乎：之前写的 Markdown 版本打开时自动转成富文本；知乎拒绝发布时直接显示知乎的原话（比如发布太频繁），图片上传失败会自动重试。各平台：页面上「AI 改写」可以写这次怎么改，助手在这一版现在的内容上改；发布频率改成只是建议，超了也照样发、排期到点就发。
  en: "Zhihu: older Markdown versions turn into rich text when opened; when Zhihu rejects a post its own message is shown (e.g. posting too often), and failed image uploads retry. All platforms: \"AI rewrite\" takes instructions and edits the current content; posting frequency is only a suggestion — posts and schedules go out even past it."
- version: 0.5.0
  zh: 每个平台的字段集中成一张表（标题发不发、正文纯文字还是富文本、配图、视频、封面、分区），模板页面照它显示。知乎文章改成和文章一样的富文本：小标题、列表、加粗、引用、图片都在正文里，发布时原样排到知乎；修了正文多张图时后面的图会丢
  en: "Each platform's fields (title, plain or rich text, images, video, cover, category) live in one table the template pages follow. Zhihu articles are rich text like articles and keep their layout when published; fixed later images getting lost when the body has several."
- version: 0.4.0
  zh: 新增知乎：添加知乎账号，把内容改写成知乎专栏文章（小标题、列表、正文配图、话题），审核后发布或排期，采集阅读、赞同、评论、收藏和粉丝数
  en: "New: Zhihu. Add a Zhihu account, rewrite content into Zhihu column articles (headings, lists, inline images, topics), review, publish or schedule, and collect views, upvotes, comments, saves and followers."
- version: 0.3.3
  zh: 社媒：修复中文版 LinkedIn 找不到发布按钮、发帖一直超时的问题
  en: "Fixed LinkedIn in Chinese not finding the Post button and timing out."
- version: 0.3.2
  zh: 社媒：提示文字里的「素材库」统一改叫「资料库」
  en: "Wording: the asset library is consistently called Library in prompts."
- version: 0.3.1
  zh: 社媒：X 发长推文（开了 Premium、超过 280 字）后能认出发布成功，不再明明发出去了却标成发布失败
  en: "X: long posts (Premium, over 280 characters) are recognized as published instead of being marked failed."
- version: 0.3.0
  zh: 社媒：写帖子时能指定配哪几张图、按什么顺序，改写时也能换图；文章里本机上传的图也能配进帖子；写推文先查字数，开了 Premium 的账号可以写长
  en: "Choose which images go in a post and in what order, also when rewriting; locally uploaded article images can be used; tweets are length-checked first and Premium accounts can write long posts."
- version: 0.2.0
  zh: 社媒：离线项目里上传的图片、视频（/_annulo/uploaded/…）也能配进帖子发布；需要 Annulo 2026.10.6-7 或更新
  en: "Images and videos uploaded in offline projects (/_annulo/uploaded/…) can be used in posts. Needs Annulo 2026.10.6-7 or later."
- version: 0.1.1
  zh: X：发推时直接点弹窗里的 Post 按钮（有时坐标点击不触发发布）；去掉两条推文至少隔 30 分钟的限制，只保留 24 小时最多 10 条
  en: "X: clicks the Post button in the dialog directly (coordinate clicks sometimes didn't publish); dropped the 30-minute gap between posts, keeping at most 10 per 24 hours."
- version: 0.1.0
  zh: 第一版：X、LinkedIn、Facebook、Instagram、YouTube、小红书、抖音、B 站的账号、帖子、发布、采集和自检
  en: "First release: accounts, posts, publishing, collecting and self-test for X, LinkedIn, Facebook, Instagram, YouTube, Xiaohongshu, Douyin and Bilibili."
